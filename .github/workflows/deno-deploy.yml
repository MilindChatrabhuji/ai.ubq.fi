name: Gateway CI
run-name: Gateway CI ${{ github.sha }}

on:
  push:
    branches: [development]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  # pull_request and workflow_dispatch: one group per ref, and a newer run cancels the superseded one.
  # push and merge_group: one group per event and commit, so a later push or queue entry never cancels
  # or replaces the run for a development or merge-group commit, and every such commit finishes CI.
  group: ai-ubq-fi-ci-${{ (github.event_name == 'push' || github.event_name == 'merge_group') && format('{0}-{1}', github.event_name, github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' && github.event_name != 'merge_group' }}

permissions:
  contents: read

env:
  GITHUB_EVENT_BEFORE: ${{ github.event.before }}

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      needs_validate: ${{ steps.scope.outputs.needs_validate }}
      needs_native: ${{ steps.scope.outputs.needs_native }}
      needs_native_build: ${{ steps.scope.outputs.needs_native_build }}
      needs_mac: ${{ steps.scope.outputs.needs_mac }}
      needs_darwin: ${{ steps.scope.outputs.needs_darwin }}
      needs_artifact: ${{ steps.scope.outputs.needs_artifact }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Determine changed-path test scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          bun --no-env-file --no-install scripts/test-scope.ts --ci-json | tee "$RUNNER_TEMP/scope.json"
          {
            echo "docs_only=$(jq -r '.docsOnly' "$RUNNER_TEMP/scope.json")"
            echo "needs_validate=$(jq -r '.needsValidate' "$RUNNER_TEMP/scope.json")"
            echo "needs_native=$(jq -r '.needsNativeKv' "$RUNNER_TEMP/scope.json")"
            echo "needs_native_build=$(jq -r '.needsNativeBuild' "$RUNNER_TEMP/scope.json")"
            echo "needs_mac=$(jq -r '.needsMacContainment' "$RUNNER_TEMP/scope.json")"
            echo "needs_darwin=$(jq -r '.needsDarwinNative' "$RUNNER_TEMP/scope.json")"
            echo "needs_artifact=$(jq -r '.needsArtifact' "$RUNNER_TEMP/scope.json")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### CI scope"
            jq -r '"reason: `\(.reason)`", "changed paths: `\(.paths | length)`", "affected tests: `\(.affectedTests | length)`", "native tests: `\(.needsNativeKv)`", "artifact: `\(.needsArtifact)`"' "$RUNNER_TEMP/scope.json"
          } >> "$GITHUB_STEP_SUMMARY"

  docs:
    needs: scope
    if: ${{ needs.scope.outputs.docs_only == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Frozen lint dependencies
        working-directory: tools/lint
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts --backend=copyfile
      - name: Validate changed documentation only
        run: |
          set -euo pipefail
          git diff --check
          bun --no-env-file --no-install scripts/test-scope.ts --check-docs

  validate:
    needs: scope
    if: ${{ needs.scope.outputs.needs_validate == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Frozen dependencies
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts --backend=copyfile
      - name: Strict TypeScript preflight
        run: bun --no-env-file run check
      - name: OpenAI request-schema drift against the verified, pinned official specification
        run: bun --no-env-file --no-install run spec:drift --verify-source
      - name: Prepare the Linux sandbox on the ephemeral runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Complete portable Bun gates
        run: sh scripts/verify.sh --no-native-kv

  native:
    needs: scope
    if: ${{ needs.scope.outputs.needs_native_build == 'true' }}
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Frozen dependencies
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts --backend=copyfile
      - name: Prepare the Linux sandbox on the ephemeral runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Prepare checksum-pinned ephemeral native toolchain
        run: bash ops/prepare-ci-native-toolchain.sh
      - name: Prepare one independently bound native KV artifact
        shell: bash
        run: |
          set -euo pipefail
          bun --no-env-file --no-install -e 'import {join,resolve} from "node:path"; import {buildNativeKv} from "./scripts/build-native-kv.ts"; const workspace=process.env.RUNNER_TEMP; if(!workspace) throw new Error("Missing runner temporary directory"); const artifactDirectory=join(workspace,"uos-native-kv/artifact"); const buildReceipt=await buildNativeKv(artifactDirectory,{toolchainDirectory:join(workspace,"uos-native-kv/toolchain/bin"),workspaceDirectory:resolve(process.env.GITHUB_WORKSPACE,"../uos-native-kv-builds")}); console.log(JSON.stringify({artifactDirectory,expectedProvenanceSha256:buildReceipt.provenanceSha256,inputsManifest:resolve("tools/native-kv/inputs.json"),buildReceipt}));'  > "$RUNNER_TEMP/uos-native-kv/receipt.json"
      - name: Preflight deployment and immutable release fixtures
        if: ${{ needs.scope.outputs.needs_native == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          bun --no-env-file --no-install run test ops/tests/mac-native-auth-permissions.test.ts "--native-kv-binding=$(cat "$RUNNER_TEMP/uos-native-kv/receipt.json")"
          bun --no-env-file --no-install run test:vps ops/tests/first-bun-cutover.test.ts "--native-kv-binding=$(cat "$RUNNER_TEMP/uos-native-kv/receipt.json")"
          bun --no-env-file --no-install run test:deploy-guards "--native-kv-binding=$(cat "$RUNNER_TEMP/uos-native-kv/receipt.json")"
          bun --no-env-file --no-install run test:vps ops/tests/vps-release.test.ts "--native-kv-binding=$(cat "$RUNNER_TEMP/uos-native-kv/receipt.json")"
      - name: Complete native and full Bun gates
        shell: bash
        run: sh scripts/verify.sh --native-kv-binding="$(cat "$RUNNER_TEMP/uos-native-kv/receipt.json")"
      - name: Package immutable source, dependencies and native KV/permissions
        if: ${{ needs.scope.outputs.needs_artifact == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release/source .release/artifact
          git archive --format=tar --output=.release/artifact/source.tar "$GITHUB_SHA"
          tar -xf .release/artifact/source.tar -C .release/source
          GITHUB_SHA="$GITHUB_SHA" bun --no-env-file -e 'const sha=process.env.GITHUB_SHA; if (!sha || !/^[0-9a-f]{40}$/.test(sha)) throw new Error("Invalid source SHA"); await Bun.write(".release/source/src/release.ts", "// Generated for this immutable VPS release.\nexport const RELEASE_GIT_SHA = " + JSON.stringify(sha) + ";\n");'
          chmod 600 .release/source/src/release.ts
          source_digest="$(sha256sum .release/artifact/source.tar | awk '{print $1}')"
          bun --no-env-file --no-install -e 'import {readFile} from "node:fs/promises"; import {prepareReleasePayload} from "./ops/release-artifact.ts"; const [root,sha,archive,receiptPath]=process.argv.slice(1); const receipt=JSON.parse(await readFile(receiptPath,"utf8")); await prepareReleasePayload(root,sha,archive,undefined,{artifactDirectory:receipt.artifactDirectory,expectedProvenanceSha256:receipt.expectedProvenanceSha256,inputsManifest:receipt.inputsManifest});' .release/source "$GITHUB_SHA" "$source_digest" "$RUNNER_TEMP/uos-native-kv/receipt.json"
          bun --no-env-file --no-install ops/release-artifact.ts verify .release/source "$GITHUB_SHA"
          tar -cf .release/artifact/release.tar -C .release/source .
          cp .release/source/.uos-release.json .release/artifact/manifest.json
          sha256sum .release/artifact/release.tar > .release/artifact/release.tar.sha256
      - name: Upload immutable artifact
        if: ${{ needs.scope.outputs.needs_artifact == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-ubq-fi-source-${{ github.sha }}
          path: .release/artifact
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  mac-containment:
    needs: scope
    if: ${{ needs.scope.outputs.needs_mac == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Actual macOS Seatbelt acceptance
        run: bun --no-env-file --no-install ops/verify-mac-sandbox.ts

  darwin-native:
    needs: scope
    if: ${{ needs.scope.outputs.needs_darwin == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Frozen dependencies
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts --backend=copyfile
      - name: Build and bind the Darwin native KV artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uos-native-kv"
          bun --no-env-file --no-install -e 'import {join,resolve} from "node:path"; import {buildNativeKvDarwin} from "./scripts/build-native-kv-darwin.ts"; const workspace=process.env.RUNNER_TEMP; if(!workspace) throw new Error("Missing runner temporary directory"); const artifactDirectory=join(workspace,"uos-native-kv/artifact"); const buildReceipt=await buildNativeKvDarwin(artifactDirectory); console.log(JSON.stringify({artifactDirectory,expectedProvenanceSha256:buildReceipt.provenanceSha256,inputsManifest:resolve("tools/native-kv/inputs-darwin-arm64.json"),buildReceipt}));' > "$RUNNER_TEMP/uos-native-kv/receipt.json"
      - name: Prove Darwin native loading and storage startup
        shell: bash
        run: |
          set -euo pipefail
          binding="$(cat "$RUNNER_TEMP/uos-native-kv/receipt.json")"
          UOS_NATIVE_KV_BINDING="$binding" bun --no-env-file --no-install -e '
            import { initializeTestNativeKv } from "./scripts/test-native-kv.ts";
            initializeTestNativeKv(JSON.parse(process.env.UOS_NATIVE_KV_BINDING));
            const { openKv } = await import("./src/storage/kv.ts");
            const kv = await openKv(":memory:");
            await kv.set(["darwin-native"], { loaded: true });
            if ((await kv.get(["darwin-native"])).value?.loaded !== true) throw new Error("Darwin native KV roundtrip failed");
            kv.close();
            console.log(JSON.stringify({ platform: process.platform, architecture: process.arch, nativeKvLoaded: true }));
          '
          bun --no-env-file --no-install ops/verify-mac-sandbox.ts "--native-kv-binding=$binding"
      - name: Sandboxed-signing helper on its macOS target
        shell: bash
        run: |
          set -euo pipefail
          bun --no-env-file --no-install run test tests/gpg-dsh.test.ts "--native-kv-binding=$(cat "$RUNNER_TEMP/uos-native-kv/receipt.json")"

  verify-artifact:
    needs: [scope, validate, native, mac-containment, darwin-native]
    if: ${{ always() && needs.scope.outputs.needs_artifact == 'true' && needs.validate.result == 'success' && needs.native.result == 'success' && (needs.mac-containment.result == 'success' || needs.mac-containment.result == 'skipped') && (needs.darwin-native.result == 'success' || needs.darwin-native.result == 'skipped') }}
    runs-on: ubuntu-26.04-arm
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ai-ubq-fi-source-${{ github.sha }}
          path: .deploy-artifact
          run-id: ${{ github.run_id }}
          repository: ${{ github.repository }}
      - name: Verify source and materialized payload
        shell: bash
        run: |
          set -euo pipefail
          expected_digest="$(jq -er '.source_archive_sha256' .deploy-artifact/manifest.json)"
          actual_digest="$(sha256sum .deploy-artifact/source.tar | awk '{print $1}')"
          test "$expected_digest" = "$actual_digest"
          git archive --format=tar --output=.expected-source.tar "$GITHUB_SHA"
          test "$actual_digest" = "$(sha256sum .expected-source.tar | awk '{print $1}')"
          test "$(jq -er '.git_sha' .deploy-artifact/manifest.json)" = "$GITHUB_SHA"
          expected_payload="$(awk '{print $1}' .deploy-artifact/release.tar.sha256)"
          test "$expected_payload" = "$(sha256sum .deploy-artifact/release.tar | awk '{print $1}')"
          mkdir .verified-release
          tar -xf .deploy-artifact/release.tar -C .verified-release
          mkdir .expected-source
          tar -xf .expected-source.tar -C .expected-source
          bun --no-env-file -e 'const sha=process.env.GITHUB_SHA; await Bun.write(".expected-source/src/release.ts", "// Generated for this immutable VPS release.\nexport const RELEASE_GIT_SHA = " + JSON.stringify(sha) + ";\n");'
          chmod 600 .expected-source/src/release.ts
          bun --no-env-file --no-install -e 'import {releaseSourceTree,verifyReleasePayload} from "./.verified-release/ops/release-artifact.ts"; await verifyReleasePayload(".verified-release", process.env.GITHUB_SHA, await releaseSourceTree(".expected-source"));'
          test "$(jq -er '.schema' .verified-release/.uos-release.json)" = 3
          cmp .deploy-artifact/manifest.json .verified-release/.uos-release.json
          baked_release_line="export const RELEASE_GIT_SHA = \"${GITHUB_SHA}\";"
          grep -Fx "$baked_release_line" .verified-release/src/release.ts
          echo "Immutable Bun source/dependency/native payload verified for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
