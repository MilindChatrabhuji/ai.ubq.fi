name: Gateway CI
run-name: Gateway CI ${{ github.sha }}

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      scope_base:
        description: Optional existing Git commit or ref for manual change scope
        required: false
        type: string
        default: ""
      base_ref:
        description: Base branch used by complete-set manual dispatch
        required: false
        type: string
        default: development
      sentinel_pr_author:
        description: Optional Sentinel App login for complete-set manual dispatch
        required: false
        type: string
        default: ""

concurrency:
  group: ai-ubq-fi-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.merge_commit_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Every scope recomputation uses the exact pre-merge base or the manual override.
  TEST_SCOPE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.scope_base }}
  # Retain the existing push-diff fallback for manual selection.
  GITHUB_EVENT_BEFORE: ${{ github.event.before }}
  # PR author is stable across owner reruns; github.actor is the initiator.
  # Global so every job's scope recomputation agrees with the scope job:
  # Sentinel App PRs select the complete check set in all jobs, not only in scope.
  # Manual pre-merge runs must opt in explicitly with base_ref + sentinel_pr_author.
  GITHUB_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || github.event.pull_request.base.ref }}
  GITHUB_PR_AUTHOR: ${{ github.event_name == 'workflow_dispatch' && inputs.sentinel_pr_author || github.event.pull_request.user.login }}

jobs:
  scope:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      needs_docs: ${{ steps.scope.outputs.needs_docs }}
      needs_validate: ${{ steps.scope.outputs.needs_validate }}
      needs_native: ${{ steps.scope.outputs.needs_native }}
      needs_native_build: ${{ steps.scope.outputs.needs_native_build }}
      needs_worker_runtime: ${{ steps.scope.outputs.needs_worker_runtime }}
      needs_mac: ${{ steps.scope.outputs.needs_mac }}
      needs_darwin: ${{ steps.scope.outputs.needs_darwin }}
      needs_darwin_tests: ${{ steps.scope.outputs.needs_darwin_tests }}
      needs_artifact: ${{ steps.scope.outputs.needs_artifact }}
      needs_typescript_validate: ${{ steps.scope.outputs.needs_typescript_validate }}
      needs_rust_native: ${{ steps.scope.outputs.needs_rust_native }}
      needs_rust_wasm: ${{ steps.scope.outputs.needs_rust_wasm }}
      needs_rust_build: ${{ steps.scope.outputs.needs_rust_build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - name: Resolve exact merged-change scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            read -r -a parents <<< "$(git rev-list --parents -n 1 HEAD)"
            if [ "${#parents[@]}" -ne 3 ]; then
              echo "::error::Automatic merged-PR scope requires an ancestry-preserving merge commit; dispatch with scope_base for squash or rebase merges."
              exit 1
            fi
            test "$(git rev-parse "$TEST_SCOPE_BASE")" = "${parents[1]}"
          elif [ -n "$TEST_SCOPE_BASE" ]; then
            git rev-parse --verify "$TEST_SCOPE_BASE^{commit}" >/dev/null
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Determine changed-path test scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          bun --no-env-file --no-install scripts/test-scope.ts --ci-json | tee "$RUNNER_TEMP/scope.json"
          {
            echo "docs_only=$(jq -r '.docsOnly' "$RUNNER_TEMP/scope.json")"
            echo "needs_docs=$(jq -r '.needsDocs' "$RUNNER_TEMP/scope.json")"
            echo "needs_validate=$(jq -r '.needsValidate' "$RUNNER_TEMP/scope.json")"
            echo "needs_native=$(jq -r '.needsNativeKv' "$RUNNER_TEMP/scope.json")"
            echo "needs_native_build=$(jq -r '.needsNativeBuild' "$RUNNER_TEMP/scope.json")"
            echo "needs_worker_runtime=$(jq -r '.needsWorkerRuntime' "$RUNNER_TEMP/scope.json")"
            echo "needs_mac=$(jq -r '.needsMacContainment' "$RUNNER_TEMP/scope.json")"
            echo "needs_darwin=$(jq -r '.needsDarwinNative' "$RUNNER_TEMP/scope.json")"
            echo "needs_darwin_tests=$(jq -r '.needsDarwinTests' "$RUNNER_TEMP/scope.json")"
            echo "needs_artifact=$(jq -r '.needsArtifact' "$RUNNER_TEMP/scope.json")"
            echo "needs_typescript_validate=$(jq -r '.needsTypeScriptValidate' "$RUNNER_TEMP/scope.json")"
            echo "needs_rust_native=$(jq -r '.needsRustNative' "$RUNNER_TEMP/scope.json")"
            echo "needs_rust_wasm=$(jq -r '.needsRustWasm' "$RUNNER_TEMP/scope.json")"
            echo "needs_rust_build=$(jq -r '.needsRustBuild' "$RUNNER_TEMP/scope.json")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### CI scope"
            jq -r '"reason: `\(.reason)`", "complete check set: `\(.completeCheckSet)`", "changed paths: `\(.paths | length)`", "affected tests: `\(.affectedTests | length)`", "native tests: `\(.needsNativeKv)`", "artifact: `\(.needsArtifact)`"' "$RUNNER_TEMP/scope.json"
          } >> "$GITHUB_STEP_SUMMARY"

  docs:
    needs: scope
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)) && (needs.scope.outputs.needs_docs == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Frozen lint dependencies
        working-directory: tools/lint
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts --backend=copyfile
      - name: Validate changed-file formatting
        run: |
          set -euo pipefail
          git diff --check
          bun --no-env-file --no-install scripts/test-scope.ts --check-docs

  portable:
    needs: scope
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)) && (needs.scope.outputs.needs_validate == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Confirm no portable checks selected
        if: ${{ needs.scope.outputs.needs_typescript_validate != 'true' }}
        run: echo "No portable TypeScript checks selected."
      - if: ${{ needs.scope.outputs.needs_typescript_validate == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - if: ${{ needs.scope.outputs.needs_typescript_validate == 'true' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Frozen dependencies
        if: ${{ needs.scope.outputs.needs_typescript_validate == 'true' }}
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts --backend=copyfile
      - name: Strict TypeScript preflight
        if: ${{ needs.scope.outputs.needs_typescript_validate == 'true' }}
        run: bun --no-env-file run check
      - name: OpenAI request-schema drift against the verified, pinned official specification
        if: ${{ needs.scope.outputs.needs_typescript_validate == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun --no-env-file --no-install run spec:drift --verify-source
      - name: Prepare the Linux sandbox on the ephemeral runner
        if: ${{ needs.scope.outputs.needs_typescript_validate == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Complete portable Bun gates
        if: ${{ needs.scope.outputs.needs_typescript_validate == 'true' }}
        run: sh scripts/verify.sh --no-native-kv

  rust-native:
    needs: [scope, portable]
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)) && (needs.scope.outputs.needs_rust_native == 'true') && (needs.portable.result == 'success') }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - name: Require the source-pinned Darwin inspector dependency
        run: |
          set -eu
          /usr/bin/python3 -I - <<'PYTHON'
          import hashlib
          import json
          import os
          import platform
          import re
          from pathlib import Path
          source = Path("rust/crates/gateway-native/src/existing_account_import/acl_inspector.rs").read_text()
          blocks = re.findall(r'^const LS_SHA256S: \[&str; 2\] = \[(.*?)^\];$', source, re.MULTILINE | re.DOTALL)
          if len(blocks) != 1:
              raise SystemExit("Cannot resolve the one current source-pinned Darwin ls identity set")
          required = re.findall(r'"([0-9a-f]{64})"', blocks[0])
          literal_set = ",".join(f'"{value}"' for value in required) + ","
          if len(required) != 2 or len(set(required)) != 2 or re.sub(r'\s+', '', blocks[0]) != literal_set:
              raise SystemExit("Darwin ls identities must be exactly two distinct source-literal SHA256 values")
          actual = hashlib.sha256(Path("/bin/ls").read_bytes()).hexdigest()
          print(f"Darwin inspector preflight: os={platform.system()}-{platform.mac_ver()[0]} kernel={os.uname().release} arch={os.uname().machine}", flush=True)
          print(f"fixed_path=/bin/ls required_sha256s={','.join(required)} actual_sha256={actual}", flush=True)
          sandbox_source = Path("rust/crates/gateway-native/src/existing_account_import/owner_runtime.rs").read_text()
          sandbox_blocks = re.findall(r'^const SANDBOX_SHA256S: \[&str; 2\] = \[(.*?)^\];$', sandbox_source, re.MULTILINE | re.DOTALL)
          if len(sandbox_blocks) != 1:
              raise SystemExit("Cannot resolve the one current source-pinned Darwin fixture sandbox identity set")
          sandbox_required = re.findall(r'"([0-9a-f]{64})"', sandbox_blocks[0])
          sandbox_literals = ",".join(f'"{value}"' for value in sandbox_required) + ","
          if len(sandbox_required) != 2 or len(set(sandbox_required)) != 2 or re.sub(r'\s+', '', sandbox_blocks[0]) != sandbox_literals:
              raise SystemExit("Darwin fixture sandbox identities must be exactly two distinct source-literal SHA256 values")
          sandbox_path = Path("/usr/bin/sandbox-exec")
          sandbox_metadata = sandbox_path.lstat()
          sandbox_actual = hashlib.sha256(sandbox_path.read_bytes()).hexdigest()
          print(f"fixed_path=/usr/bin/sandbox-exec required_sha256s={','.join(sandbox_required)} actual_sha256={sandbox_actual}", flush=True)
          print("Darwin fixture sandbox metadata: " + json.dumps({
              "uid": sandbox_metadata.st_uid, "gid": sandbox_metadata.st_gid,
              "mode": oct(sandbox_metadata.st_mode), "nlink": sandbox_metadata.st_nlink,
              "size": sandbox_metadata.st_size, "device": sandbox_metadata.st_dev,
              "inode": sandbox_metadata.st_ino,
          }, sort_keys=True), flush=True)
          if actual not in required:
              raise SystemExit("Runner /bin/ls is incompatible with the current source-pinned Darwin inspector dependency; no bootstrap or compilation was attempted")
          if sandbox_actual not in sandbox_required:
              raise SystemExit("Runner /usr/bin/sandbox-exec is incompatible with the current source-pinned Darwin fixture sandbox dependency; no bootstrap or compilation was attempted")
          PYTHON
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Require the matching Mac host and actual Seatbelt boundary
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          bun --no-env-file --no-install scripts/test-network.ts -- /usr/bin/true
      - name: Prepare pinned Rust native tools and frozen dependencies
        run: bun --no-env-file --no-install scripts/rust-verify.ts --prepare-ci native
      - name: Scoped Rust native checks and tests
        run: bun --no-env-file --no-install scripts/rust-verify.ts --stage native

  rust-wasm:
    needs: [scope, portable, rust-native]
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)) && (needs.scope.outputs.needs_rust_wasm == 'true') && (needs.rust-native.result == 'success') }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Prepare Linux Rust isolation
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          bun --no-env-file --no-install scripts/test-network.ts -- /usr/bin/true
      - name: Prepare pinned Rust WASM tools and frozen dependencies
        run: bun --no-env-file --no-install scripts/rust-verify.ts --prepare-ci wasm
      - name: Scoped WASM checks and actual locked Worker artifact
        run: bun --no-env-file --no-install scripts/rust-verify.ts --stage wasm
      - name: Upload checked Rust Worker artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-ubq-fi-rust-worker-${{ github.sha }}
          path: rust/crates/gateway-worker/build
          if-no-files-found: error
          retention-days: 14

  validate:
    needs: [scope, portable, rust-native, rust-wasm]
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)) && (always() && needs.scope.result == 'success' && needs.scope.outputs.needs_validate == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected gate
        env:
          PORTABLE_REQUIRED: ${{ needs.scope.outputs.needs_validate }}
          PORTABLE_RESULT: ${{ needs.portable.result }}
          RUST_NATIVE_REQUIRED: ${{ needs.scope.outputs.needs_rust_native }}
          RUST_NATIVE_RESULT: ${{ needs.rust-native.result }}
          RUST_WASM_REQUIRED: ${{ needs.scope.outputs.needs_rust_wasm }}
          RUST_WASM_RESULT: ${{ needs.rust-wasm.result }}
        run: |
          set -eu
          if [ "$PORTABLE_REQUIRED" = true ]; then test "$PORTABLE_RESULT" = success; fi
          if [ "$RUST_NATIVE_REQUIRED" = true ]; then test "$RUST_NATIVE_RESULT" = success; fi
          if [ "$RUST_WASM_REQUIRED" = true ]; then test "$RUST_WASM_RESULT" = success; fi

  native:
    needs: [scope, portable, rust-native, rust-wasm]
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)) && (always() && needs.scope.outputs.needs_native_build == 'true' && needs.portable.result == 'success' && (needs.rust-native.result == 'success' || needs.rust-native.result == 'skipped') && (needs.rust-wasm.result == 'success' || needs.rust-wasm.result == 'skipped')) }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Frozen dependencies
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts --backend=copyfile
      - name: Prepare the Linux sandbox on the ephemeral runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Prepare checksum-pinned ephemeral native toolchain
        run: bash ops/prepare-ci-native-toolchain.sh
      - name: Prepare pinned mixed-client Worker test runtime
        if: ${{ needs.scope.outputs.needs_worker_runtime == 'true' }}
        run: bun --no-env-file --no-install scripts/prepare-worker-test-runtime.ts
      - name: Prepare one independently bound native KV artifact
        shell: bash
        run: |
          set -euo pipefail
          bun --no-env-file --no-install -e 'import {join,resolve} from "node:path"; import {buildNativeKv} from "./scripts/build-native-kv.ts"; const workspace=process.env.RUNNER_TEMP; if(!workspace) throw new Error("Missing runner temporary directory"); const artifactDirectory=join(workspace,"uos-native-kv/artifact"); const buildReceipt=await buildNativeKv(artifactDirectory,{toolchainDirectory:join(workspace,"uos-native-kv/toolchain/bin"),workspaceDirectory:resolve(process.env.GITHUB_WORKSPACE,"../uos-native-kv-builds")}); console.log(JSON.stringify({artifactDirectory,expectedProvenanceSha256:buildReceipt.provenanceSha256,inputsManifest:resolve("tools/native-kv/inputs.json"),buildReceipt}));'  > "$RUNNER_TEMP/uos-native-kv/receipt.json"
      - name: Preflight deployment and immutable release fixtures
        if: ${{ needs.scope.outputs.needs_native == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          bun --no-env-file --no-install run test ops/tests/mac-native-auth-permissions.test.ts "--native-kv-binding=$(cat "$RUNNER_TEMP/uos-native-kv/receipt.json")"
          bun --no-env-file --no-install run test:vps ops/tests/first-bun-cutover.test.ts "--native-kv-binding=$(cat "$RUNNER_TEMP/uos-native-kv/receipt.json")"
          bun --no-env-file --no-install run test:deploy-guards "--native-kv-binding=$(cat "$RUNNER_TEMP/uos-native-kv/receipt.json")"
          bun --no-env-file --no-install run test:vps ops/tests/vps-release.test.ts "--native-kv-binding=$(cat "$RUNNER_TEMP/uos-native-kv/receipt.json")"
      - name: Complete native and full Bun gates
        shell: bash
        run: sh scripts/verify.sh --native-kv-binding="$(cat "$RUNNER_TEMP/uos-native-kv/receipt.json")"
      - name: Verify retained mixed-client runtime evidence
        if: ${{ success() && needs.scope.outputs.needs_worker_runtime == 'true' }}
        run: |
          cd .tmp/native-authority-evidence
          sha256sum --check SHA256SUMS
      - name: Upload mixed-client runtime evidence
        if: ${{ success() && needs.scope.outputs.needs_worker_runtime == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-ubq-fi-native-authority-${{ github.sha }}
          path: |
            .tmp/native-authority-evidence/mixed-runtime-result.json
            .tmp/native-authority-evidence/worker-runtime-receipt.json
            .tmp/native-authority-evidence/SHA256SUMS
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Package immutable source, dependencies and native KV/permissions
        if: ${{ needs.scope.outputs.needs_artifact == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release/source .release/artifact
          git archive --format=tar --output=.release/artifact/source.tar "$GITHUB_SHA"
          tar -xf .release/artifact/source.tar -C .release/source
          GITHUB_SHA="$GITHUB_SHA" bun --no-env-file -e 'const sha=process.env.GITHUB_SHA; if (!sha || !/^[0-9a-f]{40}$/.test(sha)) throw new Error("Invalid source SHA"); await Bun.write(".release/source/src/release.ts", "// Generated for this immutable VPS release.\nexport const RELEASE_GIT_SHA = " + JSON.stringify(sha) + ";\n");'
          chmod 600 .release/source/src/release.ts
          source_digest="$(sha256sum .release/artifact/source.tar | awk '{print $1}')"
          bun --no-env-file --no-install -e 'import {readFile} from "node:fs/promises"; import {prepareReleasePayload} from "./ops/release-artifact.ts"; const [root,sha,archive,receiptPath]=process.argv.slice(1); const receipt=JSON.parse(await readFile(receiptPath,"utf8")); await prepareReleasePayload(root,sha,archive,undefined,{artifactDirectory:receipt.artifactDirectory,expectedProvenanceSha256:receipt.expectedProvenanceSha256,inputsManifest:receipt.inputsManifest});' .release/source "$GITHUB_SHA" "$source_digest" "$RUNNER_TEMP/uos-native-kv/receipt.json"
          bun --no-env-file --no-install ops/release-artifact.ts verify .release/source "$GITHUB_SHA"
          tar -cf .release/artifact/release.tar -C .release/source .
          cp .release/source/.uos-release.json .release/artifact/manifest.json
          sha256sum .release/artifact/release.tar > .release/artifact/release.tar.sha256
      - name: Upload immutable artifact
        if: ${{ needs.scope.outputs.needs_artifact == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-ubq-fi-source-${{ github.sha }}
          path: .release/artifact
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  mac-containment:
    needs: [scope, portable]
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)) && (needs.scope.outputs.needs_mac == 'true') && (needs.portable.result == 'success') }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Actual macOS Seatbelt acceptance
        run: bun --no-env-file --no-install ops/verify-mac-sandbox.ts

  darwin-native:
    needs: [scope, portable]
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)) && (needs.scope.outputs.needs_darwin == 'true') && (needs.portable.result == 'success') }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Frozen dependencies
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts --backend=copyfile
      - name: Build and bind the Darwin native KV artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uos-native-kv"
          bun --no-env-file --no-install -e 'import {join,resolve} from "node:path"; import {buildNativeKvDarwin} from "./scripts/build-native-kv-darwin.ts"; const workspace=process.env.RUNNER_TEMP; if(!workspace) throw new Error("Missing runner temporary directory"); const artifactDirectory=join(workspace,"uos-native-kv/artifact"); const buildReceipt=await buildNativeKvDarwin(artifactDirectory); console.log(JSON.stringify({artifactDirectory,expectedProvenanceSha256:buildReceipt.provenanceSha256,inputsManifest:resolve("tools/native-kv/inputs-darwin-arm64.json"),buildReceipt}));' > "$RUNNER_TEMP/uos-native-kv/receipt.json"
      - name: Prove Darwin native loading and storage startup
        shell: bash
        run: |
          set -euo pipefail
          binding="$(cat "$RUNNER_TEMP/uos-native-kv/receipt.json")"
          UOS_NATIVE_KV_BINDING="$binding" bun --no-env-file --no-install -e '
            import { initializeTestNativeKv } from "./scripts/test-native-kv.ts";
            initializeTestNativeKv(JSON.parse(process.env.UOS_NATIVE_KV_BINDING));
            const { openKv } = await import("./src/storage/kv.ts");
            const kv = await openKv(":memory:");
            await kv.set(["darwin-native"], { loaded: true });
            if ((await kv.get(["darwin-native"])).value?.loaded !== true) throw new Error("Darwin native KV roundtrip failed");
            kv.close();
            console.log(JSON.stringify({ platform: process.platform, architecture: process.arch, nativeKvLoaded: true }));
          '
          bun --no-env-file --no-install ops/verify-mac-sandbox.ts "--native-kv-binding=$binding"
      - name: Sandboxed-signing helper on its macOS target
        if: ${{ needs.scope.outputs.needs_darwin_tests == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          bun --no-env-file --no-install run test tests/gpg-dsh.test.ts "--native-kv-binding=$(cat "$RUNNER_TEMP/uos-native-kv/receipt.json")"

  verify-artifact:
    needs: [scope, validate, native, mac-containment, darwin-native]
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)) && (always() && needs.scope.outputs.needs_artifact == 'true' && needs.validate.result == 'success' && needs.native.result == 'success' && (needs.mac-containment.result == 'success' || needs.mac-containment.result == 'skipped') && (needs.darwin-native.result == 'success' || needs.darwin-native.result == 'skipped')) }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ai-ubq-fi-source-${{ github.sha }}
          path: .deploy-artifact
          run-id: ${{ github.run_id }}
          repository: ${{ github.repository }}
      - name: Verify source and materialized payload
        shell: bash
        run: |
          set -euo pipefail
          expected_digest="$(jq -er '.source_archive_sha256' .deploy-artifact/manifest.json)"
          actual_digest="$(sha256sum .deploy-artifact/source.tar | awk '{print $1}')"
          test "$expected_digest" = "$actual_digest"
          git archive --format=tar --output=.expected-source.tar "$GITHUB_SHA"
          test "$actual_digest" = "$(sha256sum .expected-source.tar | awk '{print $1}')"
          test "$(jq -er '.git_sha' .deploy-artifact/manifest.json)" = "$GITHUB_SHA"
          expected_payload="$(awk '{print $1}' .deploy-artifact/release.tar.sha256)"
          test "$expected_payload" = "$(sha256sum .deploy-artifact/release.tar | awk '{print $1}')"
          mkdir .verified-release
          tar -xf .deploy-artifact/release.tar -C .verified-release
          mkdir .expected-source
          tar -xf .expected-source.tar -C .expected-source
          bun --no-env-file -e 'const sha=process.env.GITHUB_SHA; await Bun.write(".expected-source/src/release.ts", "// Generated for this immutable VPS release.\nexport const RELEASE_GIT_SHA = " + JSON.stringify(sha) + ";\n");'
          chmod 600 .expected-source/src/release.ts
          bun --no-env-file --no-install -e 'import {releaseSourceTree,verifyReleasePayload} from "./.verified-release/ops/release-artifact.ts"; await verifyReleasePayload(".verified-release", process.env.GITHUB_SHA, await releaseSourceTree(".expected-source"));'
          test "$(jq -er '.schema' .verified-release/.uos-release.json)" = 3
          cmp .deploy-artifact/manifest.json .verified-release/.uos-release.json
          baked_release_line="export const RELEASE_GIT_SHA = \"${GITHUB_SHA}\";"
          grep -Fx "$baked_release_line" .verified-release/src/release.ts
          echo "Immutable Bun source/dependency/native payload verified for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
