[package]
name = "gateway-authority"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gateway-core = { path = "../gateway-core" }
gateway-auth = { path = "../gateway-auth" }
gateway-providers = { path = "../gateway-providers" }
gateway-schema = { path = "../gateway-schema" }
serde.workspace = true
serde_json.workspace = true
# Reuse the exact SHA-256 implementation already pinned in tools/native-kv/Cargo.lock.
sha2 = "=0.11.0"

[target.'cfg(unix)'.dependencies]
getrandom = "=0.4.3"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
url = "=2.5.8"

[target.'cfg(unix)'.dev-dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }

[features]
default = []
native-import-fixture = []

[lints]
workspace = true
