[package]
name = "gateway-migration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gateway-core = { path = "../gateway-core" }
gateway-observability.workspace = true
gateway-claude-runtime = { path = "../gateway-claude-runtime" }
gateway-auth = { path = "../gateway-auth" }
gateway-admin = { path = "../gateway-admin" }
gateway-admin-data = { path = "../gateway-admin-data" }
gateway-admin-runtime = { path = "../gateway-admin-runtime" }
gateway-authority = { path = "../gateway-authority" }
gateway-schema = { path = "../gateway-schema" }
gateway-routing-runtime = { path = "../gateway-routing-runtime" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
gateway-native = { path = "../gateway-native" }
sha2 = "=0.10.9"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
gateway-native = { path = "../gateway-native" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[[example]]
name = "native-copied-store-inverse"
path = "tests/copied_store_inverse/native-copied-store-inverse.rs"

[[example]]
name = "native-offline-fixture"
path = "tests/support/native-offline-fixture.rs"

[[example]]
name = "offline-fixture"
path = "tests/support/offline-fixture.rs"

[[example]]
name = "worker-custody-fixture"
path = "tests/support/worker-custody-fixture.rs"

[lints]
workspace = true
