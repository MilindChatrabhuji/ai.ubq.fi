[workspace]
members = ["crates/gateway-core", "crates/gateway-worker"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
worker = "=0.8.7"
wasm-bindgen = "=0.2.129"
gateway-core = { path = "crates/gateway-core" }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "debuginfo"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
